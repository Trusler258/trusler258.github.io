<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Timestamp Tool | Trusler</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%2367e8f9'%3E%3Cpath d='M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500;700&family=Space+Grotesk:wght@500;600;700&family=Noto+Sans+SC:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<style>
.toolbar {
  padding: 10px 16px; background: var(--panel);
  border-bottom: 1px solid var(--border);
  display: flex; align-items: center; gap: 8px;
}
.toolbar a { color: var(--muted); text-decoration: none; font-size: 12px; display: flex; align-items: center; gap: 4px; transition: color .2s; font-family: var(--fm); }
.toolbar a:hover { color: var(--highlight); }

.tools-wrap {
  flex:1; max-width:600px; margin:40px auto; width:95%;
  position:relative; z-index:1;
}

.now-card {
  text-align:center; padding:20px; margin-bottom:20px;
  background:var(--panel); border:1px solid var(--border); border-radius:12px;
}
.now-label { font-family:var(--fm); font-size:11px; color:var(--muted); margin-bottom:6px; }
.now-value { font-family:var(--fm); font-size:36px; font-weight:700; color:var(--highlight); word-break:break-all; }
.now-human { font-family:var(--fm); font-size:13px; color:var(--soft); margin-top:6px; }

.convert-card {
  background:var(--panel); border:1px solid var(--border); border-radius:12px; overflow:hidden;
}
.convert-tabs { display:flex; border-bottom:1px solid var(--border); }
.convert-tab {
  flex:1; padding:12px; text-align:center; cursor:pointer;
  font-family:var(--fd); font-size:12px; font-weight:700; letter-spacing:1px;
  color:var(--muted); background:transparent; border:none;
  transition:all .2s;
}
.convert-tab:hover { color:var(--text); }
.convert-tab.active { color:var(--highlight); border-bottom:2px solid var(--highlight); }

.convert-body { padding:20px; }
.convert-body label {
  display:block; font-family:var(--fm); font-size:11px;
  color:var(--muted); margin-bottom:8px;
}
.convert-body input {
  width:100%; padding:12px 16px; background:#050510;
  border:1px solid var(--border); border-radius:8px;
  color:var(--text); font-family:var(--fm); font-size:14px;
  outline:none; transition:border-color .2s;
}
.convert-body input:focus { border-color:var(--highlight); }
.result-box {
  margin-top:16px; padding:16px; background:#050510;
  border:1px solid var(--border); border-radius:8px;
  font-family:var(--fm); font-size:14px; color:var(--highlight);
  min-height:40px; display:flex; align-items:center;
  word-break:break-all;
}
.hint { font-size:11px; color:var(--muted); margin-top:8px; }
.copy-btn {
  margin-top:10px; padding:6px 16px; background:rgba(255,255,255,.04);
  border:1px solid var(--border); border-radius:6px;
  color:var(--soft); font-size:11px; cursor:pointer;
  font-family:var(--fm); transition:all .2s;
}
.copy-btn:hover { background:rgba(103,232,249,.1); border-color:var(--highlight); color:var(--highlight); }

.auto-refresh { font-family:var(--fm); font-size:10px; color:var(--muted); text-align:center; margin-top:8px; }
</style>
</head>
<body data-tr-usler>

<div class="rainbow-line"></div>

<div class="toolbar">
  <a href="index.html">
    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/></svg>
    返回首页
  </a>
  <span style="color:var(--muted);font-size:12px;margin-left:auto;font-family:var(--fm);">Timestamp Tool</span>
</div>

<div class="tools-wrap">

  <div class="now-card">
    <div class="now-label">CURRENT UNIX TIMESTAMP</div>
    <div class="now-value" id="nowTs"></div>
    <div class="now-human" id="nowHuman"></div>
    <div class="auto-refresh" style="margin-top:4px;" id="refreshHint">等待首次刷新...</div>
  </div>

  <div class="convert-card">
    <div class="convert-tabs">
      <button class="convert-tab active" onclick="switchTab('toTime')">时间戳 → 日期</button>
      <button class="convert-tab" onclick="switchTab('toTs')">日期 → 时间戳</button>
    </div>

    <div class="convert-body" id="tabToTime">
      <label>输入 Unix 时间戳（秒或毫秒）：</label>
      <input type="text" id="tsInput" placeholder="例如: 1753786800" oninput="tsToDate()">
      <div class="result-box" id="tsResult">—</div>
      <button class="copy-btn" onclick="copyResult()">复制结果</button>
    </div>

    <div class="convert-body" id="tabToTs" style="display:none;">
      <label>输入日期时间（YYYY-MM-DD HH:mm:ss）：</label>
      <input type="text" id="dateInput" placeholder="例如: 2026-07-29 17:00:00" oninput="dateToTs()">
      <div class="result-box" id="dateResult">—</div>
      <div class="hint">不填时间默认 00:00:00，也可只填 YYYY-MM-DD</div>
      <button class="copy-btn" onclick="copyDateResult()">复制结果</button>
    </div>
  </div>

</div>

<script>
function pad(n) { return n < 10 ? '0' + n : '' + n; }

function formatDate(d) {
  return d.getFullYear() + '-' + pad(d.getMonth()+1) + '-' + pad(d.getDate()) +
    ' ' + pad(d.getHours()) + ':' + pad(d.getMinutes()) + ':' + pad(d.getSeconds());
}

function updateNow() {
  var now = Math.floor(Date.now() / 1000);
  document.getElementById('nowTs').textContent = now;
  document.getElementById('nowHuman').textContent = formatDate(new Date());
  document.getElementById('refreshHint').textContent = '自动刷新中...';
  document.getElementById('refreshHint').style.color = 'var(--ok)';
  setTimeout(function() {
    document.getElementById('refreshHint').textContent = '自动刷新中...';
    document.getElementById('refreshHint').style.color = 'var(--muted)';
  }, 500);
}

// 每秒刷新
setInterval(updateNow, 1000);
updateNow();

function tsToDate() {
  var val = document.getElementById('tsInput').value.trim();
  if (!val) { document.getElementById('tsResult').textContent = '—'; return; }
  var ts = parseInt(val);
  // 如果是毫秒级（13位），转秒
  if (ts > 1000000000000) ts = Math.floor(ts / 1000);
  var d = new Date(ts * 1000);
  if (isNaN(d.getTime())) {
    document.getElementById('tsResult').textContent = '无效的时间戳';
    document.getElementById('tsResult').style.color = '#ff5f6d';
    return;
  }
  var result = formatDate(d) + '  ' + d.toUTCString();
  document.getElementById('tsResult').textContent = result;
  document.getElementById('tsResult').style.color = 'var(--highlight)';
}

function dateToTs() {
  var val = document.getElementById('dateInput').value.trim();
  if (!val) { document.getElementById('dateResult').textContent = '—'; return; }
  // 补全时间
  if (val.length <= 10) val += ' 00:00:00';
  var d = new Date(val);
  if (isNaN(d.getTime())) {
    document.getElementById('dateResult').textContent = '无效的日期格式';
    document.getElementById('dateResult').style.color = '#ff5f6d';
    return;
  }
  var sec = Math.floor(d.getTime() / 1000);
  document.getElementById('dateResult').textContent = sec + ' (秒)  |  ' + d.getTime() + ' (毫秒)';
  document.getElementById('dateResult').style.color = 'var(--highlight)';
}

function switchTab(tab) {
  document.querySelectorAll('.convert-tab').forEach(function(t) { t.classList.remove('active'); });
  document.getElementById('tabToTime').style.display = tab === 'toTime' ? 'block' : 'none';
  document.getElementById('tabToTs').style.display = tab === 'toTs' ? 'block' : 'none';
  event.target.classList.add('active');
}

function copyResult() {
  var t = document.getElementById('tsResult').textContent;
  if (!t || t === '—') return;
  navigator.clipboard ? navigator.clipboard.writeText(t) : (function(){var ta=document.createElement('textarea');ta.value=t;document.body.appendChild(ta);ta.select();document.execCommand('copy');document.body.removeChild(ta);})();
}

function copyDateResult() {
  var t = document.getElementById('dateResult').textContent;
  if (!t || t === '—') return;
  navigator.clipboard ? navigator.clipboard.writeText(t) : (function(){var ta=document.createElement('textarea');ta.value=t;document.body.appendChild(ta);ta.select();document.execCommand('copy');document.body.removeChild(ta);})();
}
</script>
<script src="effects.js"></script>
<script>
window.live2d_path = "https://fastly.jsdelivr.net/gh/stevenjoezhang/live2d-widget@latest/";
window.live2d_cdn_path = "https://fastly.jsdelivr.net/gh/fghrsh/live2d_api/";
</script>
<script src="https://fastly.jsdelivr.net/gh/stevenjoezhang/live2d-widget@latest/autoload.js"></script>
</body>
</html>
