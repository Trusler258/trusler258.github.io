<body data-tr-usler>

<div class="rainbow-line"></div>
<div class="particles" id="particles" aria-hidden="true"></div>

<div class="blog-layout">
  <nav class="blog-nav">
    <div class="card">
      <div class="blog-nav-title">CATEGORIES</div>
      <div id="navCats"></div>
      <a href="index.html" class="blog-back">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/></svg>

    </div>
  </nav>

  <section class="blog-content">
    <div class="card">
      <div class="blog-article" id="articleContent"></div>
    </div>
  </section>

  <nav class="blog-toc" id="blogTocWrap" style="display:none">
    <div class="card">
      <div class="blog-nav-title">ON THIS PAGE</div>
      <div id="tocList"></div>
    </div>
  </nav>

<footer>
  <span id="year">2024</span> Trusler &nbsp;|&nbsp;
