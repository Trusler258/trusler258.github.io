<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MD Editor | Trusler</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%2367e8f9'%3E%3Cpath d='M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500;700&family=Space+Grotesk:wght@500;600;700&family=Noto+Sans+SC:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/atom-one-dark.min.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/animate.css@4/animate.min.css">
<link rel="stylesheet" href="style.css">
<style>
.editor-layout {
  flex: 1; display: flex; height: calc(100vh - 80px);
  gap: 0; position: relative; z-index: 1;
}
.editor-pane {
  flex: 1; display: flex; flex-direction: column;
  border: 1px solid var(--border);
}
.editor-pane:first-child { border-radius: 12px 0 0 12px; }
.editor-pane:last-child { border-radius: 0 12px 12px 0; border-left: none; }

.pane-header {
  display: flex; align-items: center; justify-content: space-between;
  padding: 10px 16px; background: var(--panel);
  border-bottom: 1px solid var(--border);
  font-family: var(--fd); font-size: 11px; font-weight: 700;
  color: var(--soft); letter-spacing: 1px;
}
.pane-header .actions { display: flex; gap: 8px; }
.pane-btn {
  padding: 4px 12px; background: rgba(255,255,255,.04);
  border: 1px solid var(--border); border-radius: 6px;
  color: var(--soft); font-size: 11px; cursor: pointer;
  font-family: var(--fm); transition: all .2s;
}
.pane-btn:hover { background: rgba(103,232,249,.1); border-color: var(--highlight); color: var(--highlight); }

#editorInput {
  flex: 1; padding: 20px; background: #050510;
  border: none; color: #a0a0c0; font-family: var(--fm);
  font-size: 13px; line-height: 1.7; resize: none;
  outline: none;
}
#editorInput::placeholder { color: var(--muted); }

#preview {
  flex: 1; padding: 20px; background: var(--bg);
  overflow-y: auto; font-size: 14px; line-height: 1.8;
}
#preview h1 { font-size: 20px; margin-bottom: 8px; border-bottom: 1px solid var(--border); padding-bottom: 8px; }
#preview h2 { font-size: 16px; margin: 20px 0 10px; color: var(--highlight); }
#preview h3 { font-size: 14px; margin: 16px 0 8px; color: var(--admin); }
#preview p { margin-bottom: 10px; color: var(--soft); }
#preview ul, #preview ol { margin: 8px 0 12px 20px; color: var(--soft); }
#preview li { margin-bottom: 3px; }
#preview code {
  background: rgba(103,232,249,.1); color: var(--highlight);
  padding: 2px 6px; border-radius: 4px; font-family: var(--fm); font-size: 12px;
}
#preview pre {
  position: relative; background: #0a0a18; border: 1px solid var(--border);
  border-radius: 8px; margin: 12px 0;
  font-family: var(--fm); font-size: 12px; line-height: 1.7;
}
#preview pre::before {
  content: '';
  display: block; padding: 8px 14px;
  background: rgba(255,255,255,.02);
  border-bottom: 1px solid var(--border);
  background-image:
    radial-gradient(circle 5px, #ff5f6d 100%, transparent 100%),
    radial-gradient(circle 5px, #ffe259 100%, transparent 100%),
    radial-gradient(circle 5px, #3ddc84 100%, transparent 100%);
  background-position: 10px center, 28px center, 46px center;
  background-repeat: no-repeat;
  background-size: 10px 10px;
}
#preview pre code { display: block; padding: 16px; background: none; color: #a0a0c0; }
#preview pre code.hljs { background: transparent; }
#preview .copy-btn {
  position: absolute; top: 6px; right: 10px; z-index: 3;
  padding: 3px 10px; border: 1px solid var(--border);
  border-radius: 6px; background: rgba(0,0,0,.6);
  color: var(--muted); font-size: 11px; cursor: pointer;
  font-family: inherit; transition: all .15s; opacity: 0;
}
#preview pre:hover .copy-btn { opacity: 1; }
#preview .copy-btn:hover { color: var(--text); border-color: rgba(103,232,249,.4);
  background: rgba(103,232,249,.08); }
#preview .copy-btn.copied { color: #3ddc84; border-color: rgba(61,220,132,.4); }
#preview pre[data-lang]::after {
  content: attr(data-lang);
  position: absolute; top: 7px; left: 62px; z-index: 2;
  font-family: var(--fm); font-size: 10px; color: var(--soft);
  text-transform: uppercase; letter-spacing: .5px; opacity: .6;
  pointer-events: none;
}
#preview blockquote {
  border-left: 2px solid var(--highlight); padding: 6px 16px;
  margin: 10px 0; color: var(--muted); font-style: italic;
}
#preview hr { border: none; border-top: 1px solid var(--border); margin: 16px 0; }
#preview table { width: 100%; border-collapse: collapse; margin: 10px 0; font-size: 13px; }
#preview th { background: var(--panel2); padding: 6px 12px; text-align: left; border: 1px solid var(--border); color: var(--highlight); font-family: var(--fm); font-size: 11px; }
#preview td { padding: 6px 12px; border: 1px solid var(--border); color: var(--soft); }
#preview strong { color: var(--text); }
#preview a { color: var(--highlight); }

.toolbar { padding: 10px 16px; background: var(--panel); border-bottom: 1px solid var(--border); display: flex; align-items: center; gap: 8px; }
.toolbar a { color: var(--muted); text-decoration: none; font-size: 12px; display: flex; align-items: center; gap: 4px; transition: color .2s; font-family: var(--fm); }
.toolbar a:hover { color: var(--highlight); }

@media (max-width: 768px) {
  .editor-layout { flex-direction: column; height: auto; }
  #editorInput, #preview { min-height: 300px; }
}
</style>
</head>
<body data-tr-usler>

<div class="rainbow-line"></div>

<div class="toolbar">
  <a href="index.html">
    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/></svg>
    返回首页
  </a>
  <span style="color:var(--muted);font-size:12px;margin-left:auto;font-family:var(--fm);">Markdown Editor</span>
</div>

<div class="editor-layout">
  <div class="editor-pane">
    <div class="pane-header">
      <span>EDITOR</span>
      <div class="actions">
        <button class="pane-btn" onclick="loadDemo()" title="加载示例">DEMO</button>
        <button class="pane-btn" onclick="clearEditor()" title="清空">CLEAR</button>
      </div>
    </div>
    <textarea id="editorInput" placeholder="在此输入 Markdown..." spellcheck="false"></textarea>
  </div>

  <div class="editor-pane">
    <div class="pane-header"><span>PREVIEW</span></div>
    <div id="preview"></div>
  </div>
</div>

<script>
var demo = '# Markdown 实时预览\n\n## 欢迎使用\n\n这是一个**纯前端**的 Markdown 编辑器，输入即渲染。\n\n### 功能演示\n\n- 支持 **粗体**、*斜体*、`行内代码`\n- 支持代码块（顶部 macOS 风格窗口栏）\n- 支持表格、引用、链接\n\n### 代码块示例\n\n```python\ndef hello():\n    print("Hello, Markdown!")\n```\n\n### 表格示例\n\n| 语言 | 难度 | 推荐度 |\n|------|------|--------|\n| Python | 低 | 高 |\n| C++ | 高 | 中 |\n| JavaScript | 中 | 高 |\n\n> Markdown 的核心哲学是 **内容优先，排版靠后**。';

function renderMarkdown(md) {
  var lines = md.split('\n');
  var html = '';
  var inCodeBlock = false, codeContent = '', codeLang = '';
  var inTable = false, tableHtml = '';
  var inList = false;

  function parseInline(text) {
    text = text.replace(/`([^`]+)`/g, '<code>$1</code>');
    text = text.replace(/\*\*\*(.+?)\*\*\*/g, '<strong><em>$1</em></strong>');
    text = text.replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');
    text = text.replace(/\*(.+?)\*/g, '<em>$1</em>');
    text = text.replace(/~~(.+?)~~/g, '<del>$1</del>');
    text = text.replace(/\[([^\]]+)\]\(([^)]+)\)/g, '<a href="$2" target="_blank">$1</a>');
    return text;
  }

  for (var i = 0; i < lines.length; i++) {
    var line = lines[i];

    if (line.trim().startsWith('```')) {
      if (inCodeBlock) {
        var langAttr = codeLang ? ' class="language-' + codeLang + '"' : '';
        html += '<pre' + (codeLang ? ' data-lang="' + codeLang + '"' : '') + '><code' + langAttr + '>' + codeContent.replace(/</g, '&lt;').replace(/>/g, '&gt;') + '</code></pre>';
        codeContent = ''; codeLang = ''; inCodeBlock = false;
      } else { inCodeBlock = true; codeLang = line.trim().slice(3).trim().split(' ')[0]; }
      continue;
    }
    if (inCodeBlock) { codeContent += (codeContent ? '\n' : '') + line; continue; }

    if (line.trim().startsWith('|') && line.trim().endsWith('|')) {
      if (!inTable) { inTable = true; tableHtml = ''; }
      var cells = line.split('|').filter(function(c) { return c.trim(); });
      if (cells.every(function(c) { return /^[-: ]+$/.test(c.trim()); })) { tableHtml += ''; continue; }
      var tag = (tableHtml.indexOf('<th') === -1 && tableHtml.indexOf('') === -1) ? 'th' : 'td';
      tableHtml += '<tr>';
      cells.forEach(function(c) { tableHtml += '<' + tag + '>' + parseInline(c.trim()) + '</' + tag + '>'; });
      tableHtml += '</tr>';
      if (i + 1 >= lines.length || !(lines[i+1].trim().startsWith('|') && lines[i+1].trim().endsWith('|'))) {
        var parts = tableHtml.split('');
        html += '<table>' + (parts[0] || '') + (parts[1] || '') + '</table>';
        inTable = false; tableHtml = '';
      }
      continue;
    }

    if (line.match(/^#{1,6}\s/)) {
      var level = line.match(/^(#{1,6})/)[1].length;
      html += '<h' + level + '>' + parseInline(line.replace(/^#{1,6}\s*/, '')) + '</h' + level + '>';
      continue;
    }

    if (line.match(/^[-*_]{3,}\s*$/)) { html += '<hr>'; continue; }
    if (line.startsWith('> ')) { html += '<blockquote>' + parseInline(line.replace(/^>\s?/, '')) + '</blockquote>'; continue; }

    if (line.match(/^[\s]*[-*+]\s/)) {
      html += '<ul>';
      var j = i;
      while (j < lines.length && lines[j].match(/^[\s]*[-*+]\s/)) {
        html += '<li>' + parseInline(lines[j].replace(/^[\s]*[-*+]\s/, '')) + '</li>';
        j++;
      }
      html += '</ul>'; i = j - 1;
      continue;
    }

    if (line.match(/^[\s]*\d+\.\s/)) {
      html += '<ol>';
      var k = i;
      while (k < lines.length && lines[k].match(/^[\s]*\d+\.\s/)) {
        html += '<li>' + parseInline(lines[k].replace(/^[\s]*\d+\.\s/, '')) + '</li>';
        k++;
      }
      html += '</ol>'; i = k - 1;
      continue;
    }

    if (line.trim() === '') continue;
    html += '<p>' + parseInline(line) + '</p>';
  }

  return html;
}

var input = document.getElementById('editorInput');
var preview = document.getElementById('preview');

function renderPreview(html) {
  preview.innerHTML = html;
  if (typeof hljs !== 'undefined') {
    preview.querySelectorAll('pre code').forEach(function(el) { hljs.highlightElement(el); });
  }
  preview.querySelectorAll('pre').forEach(function(pre) {
    if (pre.querySelector('.copy-btn')) return;
    var btn = document.createElement('button');
    btn.className = 'copy-btn'; btn.textContent = 'Copy';
    btn.onclick = function() {
      var code = pre.querySelector('code');
      var text = code ? code.textContent : pre.textContent;
      navigator.clipboard.writeText(text).then(function() {
        btn.textContent = 'Copied!'; btn.classList.add('copied');
        setTimeout(function() { btn.textContent = 'Copy'; btn.classList.remove('copied'); }, 1500);
      }).catch(function() {
        btn.textContent = 'Failed';
        setTimeout(function() { btn.textContent = 'Copy'; }, 1500);
      });
    };
    pre.appendChild(btn);
  });
}

input.addEventListener('input', function() {
  renderPreview(renderMarkdown(input.value));
});

function loadDemo() {
  input.value = demo;
  renderPreview(renderMarkdown(demo));
}

function clearEditor() {
  input.value = '';
  renderPreview('');
}

// 加载示例
loadDemo();
</script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
<script src="effects.js"></script>

window.live2d_path = "https://fastly.jsdelivr.net/npm/live2d-widget@1.0.1/";
window.live2d_cdn_path = "https://fastly.jsdelivr.net/gh/fghrsh/live2d_api/";
</script>

</body>
